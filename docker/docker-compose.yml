version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dialogus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dialogus
    ports:
      - "5432:5432"
    volumes:
      - dialogus_pgdata:/var/lib/postgresql/data

volumes:
  dialogus_pgdata:
