services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      # DATABASE_URL: defaults to local SQLite if not set in .env
      # For Supabase: postgresql://postgres:[PASSWORD]@db.[PROJECT_ID].supabase.co:5432/postgres
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./dialogus.db}
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      JWT_SECRET: "change-this-secret-in-production"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - INTERNAL_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
