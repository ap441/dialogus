services:
  backend:
    build:
      context: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./dialogus.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
